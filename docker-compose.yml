version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: medusa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - medusa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medusa-data:
